name: Preview Worker CI

on:
  push:
    branches: [main]
    paths:
      - "server/preview-worker/**"
      - "server/preview-engine/**"
      - "server/preview-api/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/preview-worker.yml"
  pull_request:
    paths:
      - "server/preview-worker/**"
      - "server/preview-engine/**"
      - "server/preview-api/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/preview-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/preview-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/preview-worker/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and test worker
        run: npm test
      - name: Verify Docker daemon is available
        run: docker info
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Run Docker-to-browser end-to-end test
        run: npm run test:e2e
        env:
          PREVIEW_E2E: "1"

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build web workspace
        run: npm run build
